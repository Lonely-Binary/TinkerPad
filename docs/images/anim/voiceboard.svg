<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="VoiceBoard: a family voice message board">
<title>VoiceBoard: a family voice message board</title>
<style>
.bg{fill:#f3f7f7} .ink{fill:#1d2b2c} .inks{stroke:#1d2b2c} .soft{fill:#5d6b6c}
.t1{font:800 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d2b2c} .t2{font:500 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4a5859}
.t3{font:700 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#117A80} .big{font:900 30px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.fb{transform-box:fill-box}
@media (prefers-color-scheme: dark){
.bg{fill:#1b2327} .ink{fill:#e6edf3} .inks{stroke:#e6edf3} .soft{fill:#a9b4bd}
.t1{fill:#e6edf3} .t2{fill:#a9b4bd} .t3{fill:#4fc3c9}}
@keyframes rec{0%{opacity:0} 4.0%{opacity:0} 5.0%{opacity:1} 33.33%{opacity:1} 34.33%{opacity:0} 100.0%{opacity:0}}.rec{animation:rec 6.0s linear infinite}@keyframes fly{0%{opacity:0} 32.33%{opacity:0} 33.33%{opacity:1} 50.0%{opacity:1} 51.0%{opacity:0} 100.0%{opacity:0}}.fly{animation:fly 6.0s linear infinite}@keyframes wait{0%{opacity:0} 50.0%{opacity:0} 51.67%{opacity:1} 58.33%{opacity:0.5} 65.0%{opacity:1} 71.67%{opacity:0.5} 76.67%{opacity:1} 78.33%{opacity:0} 100.0%{opacity:0}}.wait{animation:wait 6.0s linear infinite}@keyframes hear{0%{opacity:0} 77.33%{opacity:0} 78.33%{opacity:1} 98.33%{opacity:1} 99.33%{opacity:0} 100.0%{opacity:0}}.hear{animation:hear 6.0s linear infinite}
</style>
<rect width="560" height="280" rx="22" class="bg"/>
<polygon points="40,104 110,52 180,104" fill="#14898F"/><rect x="50" y="104" width="120" height="110" rx="6" fill="#ffffff" stroke="#d6dfe0" stroke-width="2"/><polygon points="380,104 450,52 520,104" fill="#14898F"/><rect x="390" y="104" width="120" height="110" rx="6" fill="#ffffff" stroke="#d6dfe0" stroke-width="2"/><circle cx="92" cy="156" r="18" fill="#f2c9a0"/><path d="M66 208 a26 30 0 0 1 52 0 z" fill="#ff6b4a"/><circle cx="468" cy="156" r="18" fill="#f2c9a0"/><path d="M442 208 a26 30 0 0 1 52 0 z" fill="#2f80ff"/><rect x="122" y="150" width="32" height="32" rx="5" fill="#1d2b2c"/><rect x="126" y="154" width="10" height="10" rx="2" fill="#3a464d"/><rect x="139" y="154" width="10" height="10" rx="2" fill="#3a464d"/><rect x="126" y="167" width="10" height="10" rx="2" fill="#3a464d"/><rect x="139" y="167" width="10" height="10" rx="2" fill="#3a464d"/><rect x="406" y="150" width="32" height="32" rx="5" fill="#1d2b2c"/><rect x="410" y="154" width="10" height="10" rx="2" fill="#3a464d"/><rect x="423" y="154" width="10" height="10" rx="2" fill="#3a464d"/><rect x="410" y="167" width="10" height="10" rx="2" fill="#3a464d"/><rect x="423" y="167" width="10" height="10" rx="2" fill="#3a464d"/><g class="rec"><rect x="126" y="154" width="10" height="10" rx="2" fill="#ff2a2a"/><rect x="20" y="20" width="150" height="40" rx="20" fill="#ffffff" stroke="#d6dfe0" stroke-width="2"/><polygon points="80,58 92,74 98,58" fill="#ffffff"/><text x="95" y="46" text-anchor="middle" style="font:800 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d2b2c">Dinner at 7!</text></g><path d="M170 140 Q280 40 390 140" fill="none" stroke="#9aa5ab" stroke-width="3" stroke-dasharray="4 8"/><g class="fly"><g><animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.333;0.500;1" calcMode="linear" path="M170 140 Q280 40 390 140"/><rect x="-18" y="-12" width="36" height="24" rx="4" fill="#ffffff" stroke="#14898F" stroke-width="2.5"/><path d="M-18 -12 L0 2 L18 -12" fill="none" stroke="#14898F" stroke-width="2.5"/></g></g><rect class="wait" x="413" y="154" width="10" height="10" rx="2" fill="#2f80ff"/><g class="hear"><path d="M498 144 q12 12 0 24 M508 136 q20 20 0 40" stroke="#14898F" stroke-width="3" fill="none" stroke-linecap="round"/><text x="380" y="46" style="font:800 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#117A80">♪ Dinner at 7!</text></g><text x="280" y="254" class="t3" text-anchor="middle" >Leave a voice message · it waits on their key · boards stay in sync</text>
</svg>
