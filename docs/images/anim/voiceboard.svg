<g class="a21"><text x="300" y="120" class="t1" text-anchor="start">1. Tap MIC</text><text x="300" y="148" class="t2" text-anchor="start">Then tap who it is for.</text></g><g class="a22"><text x="300" y="120" class="t1" text-anchor="start">2. Talk</text><text x="300" y="148" class="t2" text-anchor="start">Only their key glows red.</text></g><g class="a23"><text x="300" y="120" class="t1" text-anchor="start">3. Sent</text><text x="300" y="148" class="t2" text-anchor="start">Two white blinks.</text></g><g class="a24"><text x="300" y="120" class="t1" text-anchor="start">4. Waiting</text><text x="300" y="148" class="t2" text-anchor="start">Their key glows until heard.</text></g><g class="a25"><rect x="300" y="174" width="200" height="40" rx="20" class="pale"/><text x="400" y="200" class="t3" text-anchor="middle">“Dinner at seven!”</text></g><text x="300" y="246" class="t2" text-anchor="start">Several boards stay in sync.</text>
