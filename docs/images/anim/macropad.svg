<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="MacroPad: a Bluetooth shortcut keyboard">
<title>MacroPad: a Bluetooth shortcut keyboard</title>
<style>
.bg{fill:#f3f7f7} .ink{fill:#1d2b2c} .inks{stroke:#1d2b2c} .soft{fill:#5d6b6c}
.t1{font:800 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d2b2c} .t2{font:500 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4a5859}
.t3{font:700 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#117A80} .big{font:900 30px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.fb{transform-box:fill-box}
@media (prefers-color-scheme: dark){
.bg{fill:#1b2327} .ink{fill:#e6edf3} .inks{stroke:#e6edf3} .soft{fill:#a9b4bd}
.t1{fill:#e6edf3} .t2{fill:#a9b4bd} .t3{fill:#4fc3c9}}
@keyframes k0{0%{transform:translate(0px,0px)} 6.67%{transform:translate(0px,0px)} 8.44%{transform:translate(0px,6px)} 14.44%{transform:translate(0px,6px)} 16.67%{transform:translate(0px,0px)} 100.0%{transform:translate(0px,0px)}}.k0{animation:k0 4.5s linear infinite}@keyframes k1{0%{transform:translate(0px,0px)} 37.78%{transform:translate(0px,0px)} 39.56%{transform:translate(0px,6px)} 45.56%{transform:translate(0px,6px)} 47.78%{transform:translate(0px,0px)} 100.0%{transform:translate(0px,0px)}}.k1{animation:k1 4.5s linear infinite}@keyframes k2{0%{transform:translate(0px,0px)} 68.89%{transform:translate(0px,0px)} 70.67%{transform:translate(0px,6px)} 76.67%{transform:translate(0px,6px)} 78.89%{transform:translate(0px,0px)} 100.0%{transform:translate(0px,0px)}}.k2{animation:k2 4.5s linear infinite}@keyframes w0{0%{opacity:0} 5.33%{opacity:0} 6.67%{opacity:1} 17.78%{opacity:1} 19.11%{opacity:0} 100.0%{opacity:0}}.w0{animation:w0 4.5s linear infinite}@keyframes w1{0%{opacity:0} 36.44%{opacity:0} 37.78%{opacity:1} 48.89%{opacity:1} 50.22%{opacity:0} 100.0%{opacity:0}}.w1{animation:w1 4.5s linear infinite}@keyframes w2{0%{opacity:0} 67.56%{opacity:0} 68.89%{opacity:1} 80.0%{opacity:1} 81.33%{opacity:0} 100.0%{opacity:0}}.w2{animation:w2 4.5s linear infinite}@keyframes cp{0%{opacity:0} 8.67%{opacity:0} 10.0%{opacity:1} 35.56%{opacity:1} 36.89%{opacity:0} 100.0%{opacity:0}}.cp{animation:cp 4.5s linear infinite}@keyframes ps{0%{opacity:0} 39.78%{opacity:0} 41.11%{opacity:1} 66.67%{opacity:1} 68.0%{opacity:0} 100.0%{opacity:0}}.ps{animation:ps 4.5s linear infinite}@keyframes sh{0%{opacity:0} 70.89%{opacity:0} 72.22%{opacity:0.9} 76.67%{opacity:0.9} 78.0%{opacity:0} 100.0%{opacity:0}}.sh{animation:sh 4.5s linear infinite}@keyframes sh2{0%{opacity:0} 75.33%{opacity:0} 76.67%{opacity:1} 95.56%{opacity:1} 96.89%{opacity:0} 100.0%{opacity:0}}.sh2{animation:sh2 4.5s linear infinite}
</style>
<rect width="560" height="280" rx="22" class="bg"/>
<rect x="40" y="118" width="66" height="66" rx="12" fill="#0d5e62"/><g class="k0"><rect x="40" y="110" width="66" height="66" rx="12" fill="#14898F"/><text x="73" y="144" text-anchor="middle" style="font:800 18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">⌘C</text><text x="73" y="164" text-anchor="middle" style="font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdeff0">Copy</text></g><rect x="118" y="118" width="66" height="66" rx="12" fill="#0d5e62"/><g class="k1"><rect x="118" y="110" width="66" height="66" rx="12" fill="#14898F"/><text x="151" y="144" text-anchor="middle" style="font:800 18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">⌘V</text><text x="151" y="164" text-anchor="middle" style="font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdeff0">Paste</text></g><rect x="196" y="118" width="66" height="66" rx="12" fill="#0d5e62"/><g class="k2"><rect x="196" y="110" width="66" height="66" rx="12" fill="#14898F"/><text x="229" y="144" text-anchor="middle" style="font:800 18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">⌘⇧4</text><text x="229" y="164" text-anchor="middle" style="font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdeff0">Shot</text></g><g transform="translate(296 128)"><circle r="22" fill="#2f80ff"/><path d="M-6 -9 L8 4 L1 11 V-11 L8 -4 L-6 9" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/></g><path class="w0" d="M326 112 q12 16 0 32 M336 104 q20 24 0 48" stroke="#2f80ff" stroke-width="3" fill="none" stroke-linecap="round"/><path class="w1" d="M326 112 q12 16 0 32 M336 104 q20 24 0 48" stroke="#2f80ff" stroke-width="3" fill="none" stroke-linecap="round"/><path class="w2" d="M326 112 q12 16 0 32 M336 104 q20 24 0 48" stroke="#2f80ff" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="350" y="62" width="180" height="120" rx="10" fill="#26323a"/><rect x="360" y="72" width="160" height="100" rx="4" fill="#ffffff"/><path d="M334 194 h212 l-14 14 h-184 z" fill="#3a464d"/><rect x="372" y="84" width="110" height="8" rx="4" fill="#d6dfe0"/><rect x="372" y="102" width="80" height="8" rx="4" fill="#d6dfe0"/><rect x="372" y="120" width="110" height="8" rx="4" fill="#d6dfe0"/><rect x="372" y="138" width="80" height="8" rx="4" fill="#d6dfe0"/><g class="cp"><rect x="370" y="80" width="114" height="16" rx="3" fill="#2f80ff" opacity="0.35"/><text x="440" y="164" text-anchor="middle" style="font:800 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2f80ff">Copied</text></g><g class="ps"><rect x="372" y="138" width="110" height="8" rx="4" fill="#2ecc71"/><text x="440" y="164" text-anchor="middle" style="font:800 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2ecc71">Pasted</text></g><rect class="sh" x="360" y="72" width="160" height="100" rx="4" fill="#ffffff"/><g class="sh2"><rect x="376" y="80" width="128" height="76" rx="4" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-dasharray="6 4"/><text x="440" y="164" text-anchor="middle" style="font:800 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ff9f1c">Screenshot</text></g><text x="40" y="62" class="t1" text-anchor="start" >Any shortcut on any key</text><text x="40" y="236" class="t2" text-anchor="start" >Set them up from a web page,</text><text x="40" y="258" class="t2" text-anchor="start" >then pair over Bluetooth.</text>
</svg>
