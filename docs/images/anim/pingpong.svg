<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="PingPong: table tennis for two players">
<title>PingPong: table tennis for two players</title>
<style>
.bg{fill:#f3f7f7} .ink{fill:#1d2b2c} .inks{stroke:#1d2b2c} .soft{fill:#5d6b6c}
.t1{font:800 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d2b2c} .t2{font:500 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4a5859}
.t3{font:700 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#117A80} .big{font:900 30px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.fb{transform-box:fill-box}
@media (prefers-color-scheme: dark){
.bg{fill:#1b2327} .ink{fill:#e6edf3} .inks{stroke:#e6edf3} .soft{fill:#a9b4bd}
.t1{fill:#e6edf3} .t2{fill:#a9b4bd} .t3{fill:#4fc3c9}}
@keyframes pl{0%{transform:rotate(-25deg)} 5.0%{transform:rotate(10deg)} 14.58%{transform:rotate(-25deg)} 100.0%{transform:rotate(-25deg)}}.pl{transform-origin:52px 180px;animation:pl 2.4s linear infinite}@keyframes pr{0%{transform:rotate(25deg)} 50.0%{transform:rotate(25deg)} 55.0%{transform:rotate(-10deg)} 64.58%{transform:rotate(25deg)} 100.0%{transform:rotate(25deg)}}.pr{transform-origin:508px 180px;animation:pr 2.4s linear infinite}
</style>
<rect width="560" height="280" rx="22" class="bg"/>
<polygon points="110,90 450,90 520,230 40,230" fill="#1f6fb2"/><polygon points="110,90 450,90 520,230 40,230" fill="none" stroke="#fff" stroke-width="4"/><line x1="280" y1="90" x2="280" y2="230" stroke="#fff" stroke-width="2" opacity="0.7"/><rect x="268" y="70" width="24" height="168" fill="#dfe6ea"/><line x1="280" y1="70" x2="280" y2="238" stroke="#9aa5ab" stroke-width="2"/><rect x="40" y="230" width="480" height="12" fill="#17507f"/><g class="pl"><rect x="46" y="176" width="12" height="44" rx="5" fill="#8b5a3c"/><circle cx="52" cy="160" r="30" fill="#e74c3c"/></g><g class="pr"><rect x="502" y="176" width="12" height="44" rx="5" fill="#8b5a3c"/><circle cx="508" cy="160" r="30" fill="#14898F"/></g><ellipse rx="10" ry="4" fill="#000" opacity="0.18"><animateMotion dur="2.4s" repeatCount="indefinite" path="M80 210 L320 205 L480 210 L240 205 L80 210"/></ellipse><circle r="10" fill="#ffffff" stroke="#f39c12" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M80 150 Q190 40 320 170 Q400 70 480 150 Q370 40 240 170 Q160 70 80 150"/></circle><text x="280" y="44" class="t1" text-anchor="middle" >Two players, one board</text><text x="280" y="270" class="t3" text-anchor="middle" >Hit it back when it reaches your edge · first to 5 wins</text>
</svg>
